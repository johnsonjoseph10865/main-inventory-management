<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Management System</title>
  <link rel="stylesheet" href="/src/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Single Click Login View -->
  <div id="auth-screen" class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-icon">
          <i data-lucide="boxes"></i>
        </div>
        <h2>InventoryOS</h2>
        <p>Select your portal role to log in instantly</p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 1rem;">
        <button class="btn btn-primary quick-login-card-btn" data-role="admin" style="padding: 1.1rem; justify-content: flex-start; gap: 1rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); color: #ffffff;">
          <div style="width: 42px; height: 42px; border-radius: 50%; background: #ffffff; color: #1a1a1a; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">
            <i data-lucide="shield"></i>
          </div>
          <div style="text-align: left;">
            <div style="font-family: 'Russo One', sans-serif; font-size: 1.05rem; letter-spacing: 0.03em;">Login as Admin</div>
            <div style="font-size: 0.775rem; color: #b3b3b3;">Full system control, User management & Audit logs</div>
          </div>
        </button>

        <button class="btn btn-primary quick-login-card-btn" data-role="staff" style="padding: 1.1rem; justify-content: flex-start; gap: 1rem; background: rgba(212, 212, 212, 0.08); border: 1px solid rgba(212, 212, 212, 0.18); color: #d4d4d4;">
          <div style="width: 42px; height: 42px; border-radius: 50%; background: #d4d4d4; color: #1a1a1a; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">
            <i data-lucide="briefcase"></i>
          </div>
          <div style="text-align: left;">
            <div style="font-family: 'Russo One', sans-serif; font-size: 1.05rem; letter-spacing: 0.03em;">Login as Staff</div>
            <div style="font-size: 0.775rem; color: #b3b3b3;">Add & Edit Stock, Fulfill orders & Categories</div>
          </div>
        </button>

        <button class="btn btn-primary quick-login-card-btn" data-role="user" style="padding: 1.1rem; justify-content: flex-start; gap: 1rem; background: rgba(179, 179, 179, 0.06); border: 1px solid rgba(179, 179, 179, 0.15); color: #b3b3b3;">
          <div style="width: 42px; height: 42px; border-radius: 50%; background: #b3b3b3; color: #1a1a1a; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">
            <i data-lucide="user"></i>
          </div>
          <div style="text-align: left;">
            <div style="font-family: 'Russo One', sans-serif; font-size: 1.05rem; letter-spacing: 0.03em;">Login as Customer</div>
            <div style="font-size: 0.775rem; color: #b3b3b3;">Browse products, place orders & track history</div>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- Main App Layout (Hidden until logged in) -->
  <div id="app-container" style="display: none;">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">
          <i data-lucide="boxes"></i>
        </div>
        <div class="logo-text">InventoryOS</div>
      </div>

      <nav class="sidebar-menu" id="sidebar-menu">
        <!-- Dynamically rendered based on User Role -->
      </nav>

      <div class="sidebar-footer">
        <div class="user-card" id="user-profile-card">
          <div class="user-avatar" id="user-avatar-text">A</div>
          <div class="user-info">
            <div class="user-name" id="user-display-name">Admin User</div>
            <span class="role-badge role-admin" id="user-display-role">ADMIN</span>
          </div>
          <button class="btn btn-secondary btn-icon" id="logout-btn" title="Logout">
            <i data-lucide="log-out"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-wrapper">
      <header class="topbar">
        <div class="page-header-title">
          <h1 id="page-title">Dashboard</h1>
        </div>

        <div class="topbar-actions">
          <div class="quick-role-switcher">
            <i data-lucide="shield"></i>
            <span>Switch Role:</span>
            <select id="quick-role-select">
              <option value="admin">Admin</option>
              <option value="staff">Staff</option>
              <option value="user">User (Customer)</option>
            </select>
          </div>
        </div>
      </header>

      <div class="content-body" id="main-content">
        <!-- Dynamic Page View Renders Here -->
      </div>
    </main>
  </div>

  <!-- Reusable Dynamic Modal -->
  <div class="modal-backdrop" id="app-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Modal Title</h3>
        <button class="modal-close" id="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Modal Content -->
      </div>
      <div class="modal-footer" id="modal-footer">
        <button class="btn btn-secondary" id="modal-cancel-btn">Cancel</button>
        <button class="btn btn-primary" id="modal-submit-btn">Save</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
